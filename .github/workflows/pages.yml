# Baut das Kart-Spiel (kart/) und veröffentlicht es zusammen mit der
# bestehenden Website auf GitHub Pages. Das Spiel liegt danach unter /kart/.
#
# Voraussetzung in den Repository-Einstellungen:
#   Settings → Pages → Source: "GitHub Actions"
#   Für Branches außer main zusätzlich:
#   Settings → Environments → github-pages → Deployment branches: Regel "claude/*"

name: Website und Kart-Spiel veröffentlichen

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kart/package-lock.json

      - name: Spiel prüfen und bauen
        working-directory: kart
        run: |
          npm ci
          npm test
          npm run build

      - name: Seite zusammenstellen
        run: |
          mkdir _site
          # Die Website so übernehmen, wie sie im Repository liegt – ohne den
          # Quellcode des Spiels, der durch den fertigen Build ersetzt wird.
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' --exclude='kart' ./ _site/
          mkdir -p _site/kart
          cp -r kart/dist/. _site/kart/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
